plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // This replaces the old "apply from: flutter.gradle"
    id "dev.flutter.flutter-gradle-plugin"

    // If you use Firebase/Play services, apply here (version lives in settings.gradle)
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

}
android {
    namespace = "com.myzoo.marchant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.myzoo.marchant"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            crunchPngs false  // Paste this line
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    // Let the Kotlin plugin control the version; don’t hardcode $kotlin_version
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // Use AndroidX Multidex (not the old support library)
    implementation "androidx.multidex:multidex:2.0.1"

    // Your ML Kit / Firebase stack
    implementation platform("com.google.firebase:firebase-bom:31.1.1")
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:18.0.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}